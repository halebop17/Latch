name: Latch

options:
  bundleIdPrefix: com.latch
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16"

targets:
  Latch:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: Latch

    dependencies:
      - sdk: AppIntents.framework

    info:
      path: Latch/Info.plist
      properties:
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.1.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: Latch URL Scheme
            CFBundleURLSchemes:
              - latch

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.latch.app
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # Ad-hoc signing — works locally without a Developer ID certificate
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        # Suppress auto-generate so our custom Info.plist is used exclusively
        GENERATE_INFOPLIST_FILE: "NO"
        # Swift 5 language mode — avoids strict Swift 6 concurrency errors
        SWIFT_STRICT_CONCURRENCY: minimal
        # Keep build output lean during development
        DEBUG_INFORMATION_FORMAT: dwarf
        # App icon from asset catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
